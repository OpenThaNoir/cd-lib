<!DOCTYPE html>
<html lang="en" data-theme="hcdark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CD Shelves</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CD Shelves">
<style>
:root,html[data-theme="hcdark"]{--bg:#000;--panel:#111;--panel2:#1f1f1f;--line:#fff;--ink:#fff;--mute:#e8e8e8;--acc:#ffd400;--acc-ink:#000;--danger:#ff9a8f;--bw:2px;--shelf:#ffd400}
html[data-theme="hclight"]{--bg:#fff;--panel:#fff;--panel2:#eee;--line:#000;--ink:#000;--mute:#2b2b2b;--acc:#000;--acc-ink:#fff;--danger:#b00020;--bw:2px;--shelf:#000}
html[data-theme="soft"]{--bg:#1c1814;--panel:#262019;--panel2:#2f2820;--line:#3d342a;--ink:#f3ebdd;--mute:#cfc3ae;--acc:#e8a03c;--acc-ink:#1c1814;--danger:#ff8a78;--bw:1px;--shelf:#6b4a2b}
html{font-size:var(--fs,22px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Verdana,"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:1rem;line-height:1.5;letter-spacing:.01em;min-height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:.22rem solid var(--acc);outline-offset:.12rem}
html[data-theme="hclight"] :focus-visible{outline-color:#0050d0}
.app{max-width:44rem;margin:0 auto;padding:0 1rem 6rem}

.bar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;padding:.8rem 0 .7rem;border-bottom:var(--bw) solid var(--line);margin-bottom:1rem}
.bar h1{margin:0;font-size:1.5rem;line-height:1.2;flex:1 1 8rem;min-width:8rem;overflow-wrap:anywhere}
.bar .icon{order:2}.bar h1{order:1}.bar .icon[data-a=back]{order:0}
.bar .sub{display:block;font-size:.9rem;font-weight:400;color:var(--mute);letter-spacing:0;margin-top:.1rem}
.icon{min-width:3.2rem;height:3.2rem;border-radius:.8rem;background:var(--panel);border:var(--bw) solid var(--line);display:grid;place-items:center;font-size:1.15rem;font-weight:700;flex:none;padding:0 .4rem}
.icon:active{background:var(--panel2)}

.shelves{display:grid;grid-template-columns:1fr;gap:1rem}
.shelf{background:var(--panel);border-radius:1rem;padding:1rem 1rem 0;text-align:left;display:block;width:100%;border:var(--bw) solid var(--line);overflow:hidden}
.shelf:active{background:var(--panel2)}
.shelf .nm{font-weight:700;font-size:1.3rem;line-height:1.25;overflow-wrap:anywhere}
.shelf .ct{color:var(--mute);font-size:1rem;margin-bottom:.8rem}
.spines{display:flex;align-items:flex-end;gap:.15rem;height:2.6rem;border-bottom:.5rem solid var(--shelf);margin:0 -1rem;padding:0 1rem}
.spines i{display:block;width:.4rem;border-radius:2px 2px 0 0}
html:not([data-theme="soft"]) .spines i{background:var(--acc)!important}
.newshelf{border:var(--bw) dashed var(--line);background:none;color:var(--ink);min-height:6rem;display:grid;place-items:center;border-radius:1rem;font-size:1.25rem;font-weight:700;width:100%}
.newshelf b{display:block;font-size:2.2rem;color:var(--acc);line-height:1}

.search,.field{width:100%;min-width:0;background:var(--bg);border:var(--bw) solid var(--line);border-radius:.7rem;padding:.7rem .8rem;min-height:3.2rem}
.search{margin:0 0 1rem}
.search::placeholder,.field::placeholder{color:var(--mute);opacity:1}

.quick{background:var(--panel);border:var(--bw) solid var(--line);border-radius:1rem;padding:.8rem;margin:0 0 1rem;display:grid;gap:.6rem}
.quick .row,.edit .row{display:flex;gap:.6rem}
.btn{background:var(--acc);color:var(--acc-ink);font-weight:700;border-radius:.7rem;padding:.7rem 1rem;white-space:nowrap;min-height:3.2rem;border:var(--bw) solid var(--acc)}
.btn.alt{background:var(--panel2);color:var(--ink);border-color:var(--line);font-weight:600}
.btn.bad{background:none;color:var(--danger);border:var(--bw) solid var(--danger)}
.letter{font-size:1.15rem;font-weight:800;color:var(--acc);margin:1.2rem .2rem .4rem;border-bottom:var(--bw) solid var(--line)}
html[data-theme="hclight"] .letter{color:#000}
.cd{background:var(--panel);border:var(--bw) solid var(--line);border-radius:.8rem;margin-bottom:.5rem;overflow:hidden}
.cd>button{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;padding:.6rem .9rem .6rem .6rem;min-height:3.4rem}
.cd .tx{flex:1;min-width:0}
.art{flex:none;width:min(4.2rem,22vw);aspect-ratio:1;border-radius:.4rem;overflow:hidden;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;color:var(--mute)}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art svg{width:70%;height:70%}
.artrow{display:flex;gap:.6rem}.artrow .btn{flex:1;white-space:normal;font-size:.9rem;padding:.5rem .6rem}
.cd .a{color:var(--mute);font-size:.95rem}
.cd .t{font-weight:700;font-size:1.15rem;line-height:1.3;overflow-wrap:anywhere}
.cd .meta{color:var(--mute);font-size:.9rem}
.edit{padding:.6rem .9rem 1rem;display:grid;gap:.7rem;border-top:var(--bw) solid var(--line)}
.edit label,.sheet label{font-size:.95rem;color:var(--ink);display:grid;gap:.25rem;font-weight:600}
.scanbtn{width:100%;margin:0 0 1rem}
.srow{background:var(--panel);border:var(--bw) solid var(--line);border-radius:1rem;padding:.8rem;margin-bottom:.8rem;display:grid;gap:.6rem}
.srow label{font-size:.95rem;font-weight:600;display:grid;gap:.25rem}
.srow-top{display:flex;align-items:center;justify-content:space-between;gap:.8rem}
.chk{display:flex!important;align-items:center;gap:.6rem;font-size:1.15rem!important}
.chk input{width:1.9rem;height:1.9rem;accent-color:var(--acc)}
.sbar{position:fixed;left:0;right:0;bottom:0;padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom));background:var(--bg);border-top:var(--bw) solid var(--line);max-width:44rem;margin:0 auto;z-index:6}
.cd .go{flex:none;font-size:1.8rem;color:var(--mute);line-height:1}
.hero{display:grid;place-items:center;margin:.2rem 0 1.2rem}
.hero .art{width:min(15rem,70vw);border-radius:.7rem;border:var(--bw) solid var(--line)}
.detail{display:grid;gap:.9rem}
.detail label{font-size:.95rem;font-weight:600;display:grid;gap:.25rem}
.edit .row:not(:last-child){flex-direction:column}
.empty{text-align:center;color:var(--mute);padding:2.5rem .6rem;font-size:1.1rem}
.empty b{display:block;font-size:2.4rem;margin-bottom:.4rem}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;justify-content:center;z-index:20;overflow-y:auto}
.sheet{background:var(--panel);width:100%;max-width:34rem;max-height:92dvh;overflow-y:auto;border-radius:1.2rem 1.2rem 0 0;padding:1.2rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom));display:grid;gap:.8rem;border:var(--bw) solid var(--line);border-bottom:0}
.sheet h2{margin:0;font-size:1.4rem;line-height:1.25}
.sheet p{margin:0;color:var(--mute);font-size:1rem}
.sheet .row{display:flex;gap:.6rem}.sheet .row>*{flex:1}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--acc);color:var(--acc-ink);font-weight:700;
  padding:.8rem 1.2rem;border-radius:.8rem;font-size:1.05rem;z-index:30;max-width:92vw;text-align:center;border:var(--bw) solid var(--bg)}
textarea.field{min-height:7rem;font-family:ui-monospace,Menlo,monospace;font-size:.85rem}
textarea.tracks{font-family:inherit;font-size:1rem;line-height:1.6;resize:vertical}
.menu{display:grid;gap:.6rem}
.menu button.item{display:block;width:100%;text-align:left;padding:.8rem 1rem;background:var(--panel2);border:var(--bw) solid var(--line);border-radius:.7rem;min-height:3.4rem;font-weight:600}
.opts{display:grid;gap:.5rem}
.opt{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;padding:.7rem .9rem;border:var(--bw) solid var(--line);border-radius:.7rem;min-height:3.4rem;font-weight:600;background:var(--panel2)}
.opt[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.opt .sw{width:1.6rem;height:1.6rem;border-radius:.3rem;border:2px solid #888;flex:none}
@media(min-width:720px){.shelves{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function(){
"use strict";
var KEY="cdshelves.v1", OLD="cdlog.v1";
var S={shelves:[],cds:[]};            // state
var ui={open:null,q:"",sheet:null};   // open = id of cd being edited
var app=document.getElementById("app");
var PK="cdshelves.prefs",P={theme:"hcdark",size:22};
var SIZES=[["Large",22],["Extra large",28],["Huge",34],["Standard",18]];
var THEMES=[["hcdark","Black background, yellow and white","#000"],["hclight","White background, black text","#fff"],["soft","Soft dark (original)","#1c1814"]];
function loadPrefs(){try{var p=JSON.parse(localStorage.getItem(PK)||"null");if(p){P.theme=p.theme||P.theme;P.size=p.size||P.size}}catch(e){}applyPrefs()}
function applyPrefs(){var d=document.documentElement;d.setAttribute("data-theme",P.theme);d.style.setProperty("--fs",P.size+"px");
  var m=document.querySelector('meta[name=theme-color]');if(m)m.content=({hcdark:"#000000",hclight:"#ffffff",soft:"#1c1814"})[P.theme]||"#000000";
  try{localStorage.setItem(PK,JSON.stringify(P))}catch(e){}}

/* ---------- storage ---------- */
function load(){
  try{var d=JSON.parse(localStorage.getItem(KEY)||"null"); if(d&&d.shelves){S=d;return}}catch(e){}
  // migrate earlier flat list if present
  try{
    var old=JSON.parse(localStorage.getItem(OLD)||"[]");
    if(old.length){var sh={id:uid(),name:"Unsorted"};S.shelves=[sh];
      S.cds=old.map(function(o){return{id:o.id||uid(),shelf:sh.id,artist:o.artist||"",title:o.title||"",year:o.year||"",notes:o.notes||""}});save()}
  }catch(e){}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Couldn't save — storage is full or blocked")}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function cmp(a,b){return String(a||"").toLowerCase().localeCompare(String(b||"").toLowerCase(),undefined,{numeric:true})}
function shelfById(id){return S.shelves.find(function(s){return s.id===id})}
function cdsOn(id){return S.cds.filter(function(c){return c.shelf===id})}
function hue(str){var h=0;for(var i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))>>>0;return h%360}
function route(){var h=location.hash.slice(1).split("/")[0];return h&&shelfById(h)?h:null}
function routeScan(){var p=location.hash.slice(1).split("/");return !!route()&&p[1]==="scan"}
function routeCd(){var p=location.hash.slice(1).split("/");var sid=route();return sid&&p[1]?(S.cds.find(function(c){return c.id===p[1]&&c.shelf===sid})||null):null}
function go(id){ui.open=null;ui.q="";location.hash=id||"";if(!id)render()}
var toastT;function toast(t){var e=document.createElement("div");e.className="toast";e.setAttribute("role","status");e.textContent=t;document.body.appendChild(e);clearTimeout(toastT);setTimeout(function(){e.remove()},4500)}


/* ---------- cover art (Apple iTunes Search API, looked up on this device) ---------- */
var DISC='<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="24" cy="24" r="7" fill="none" stroke="currentColor" stroke-width="3"/></svg>';
function thumb(c){return '<span class="art" data-art="'+c.id+'" aria-hidden="true">'+(c.art?'<img src="'+esc(c.art)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':DISC)+'</span>'}
function nrm(x){return String(x||"").toLowerCase().replace(/\(.*?\)|\[.*?\]/g," ").replace(/&/g," and ").replace(/^the /,"").replace(/[^a-z0-9]+/g," ").trim()}
function close(a,b){a=nrm(a);b=nrm(b);return !!a&&!!b&&(a===b||a.indexOf(b)>-1||b.indexOf(a)>-1)}
async function lookup(term,c){
  var r=await fetch("https://itunes.apple.com/search?media=music&entity=album&limit=8&term="+encodeURIComponent(term));
  if(!r.ok)throw new Error("http "+r.status);
  var j=await r.json(), hits=(j.results||[]).filter(function(x){return x.artworkUrl100});
  var best=hits.find(function(x){return nrm(x.collectionName)===nrm(c.title)&&close(x.artistName,c.artist)})
        ||hits.find(function(x){return close(x.collectionName,c.title)&&close(x.artistName,c.artist)});
  return best?{art:best.artworkUrl100.replace(/\/\d+x\d+(bb)?\./,"/300x300bb."),src:{i:best.collectionId}}:null;
}
// fallback: MusicBrainz + Cover Art Archive (covers albums missing from Apple's catalog)
async function mbLookup(c){
  var q='releasegroup:"'+c.title.replace(/["\\]/g," ")+'" AND artist:"'+c.artist.replace(/["\\]/g," ")+'" AND primarytype:album';
  var r=await fetch("https://musicbrainz.org/ws/2/release-group/?fmt=json&limit=8&query="+encodeURIComponent(q));
  if(!r.ok)throw new Error("http "+r.status);
  var j=await r.json(), g=(j["release-groups"]||[]).find(function(x){
    var ac=(x["artist-credit"]||[]).map(function(a){return a.name}).join(" ");
    return nrm(x.title)===nrm(c.title)&&close(ac,c.artist)});
  if(!g)return null;
  var u="https://coverartarchive.org/release-group/"+g.id+"/front-250",art=null;
  try{var h=await fetch(u);if(h.ok)art=u}catch(e){}
  return {art:art,src:{m:g.id}};
}
async function fetchArt(c){   // -> {art, src} or null
  var u=await lookup(c.artist+" "+c.title,c);
  if(!u){var t2=c.title.replace(/\(.*?\)|\[.*?\]/g,"").trim();if(t2&&t2!==c.title)u=await lookup(c.artist+" "+t2,c)}
  if(!u)u=await mbLookup(c);
  return u;
}
async function getJSON(url){var r=await fetch(url);if(!r.ok)throw new Error("http "+r.status);return r.json()}
async function fetchTracks(c){   // -> text, one track per line, or null
  if(!c.src){var f=await fetchArt(c);if(!f)return null;c.src=f.src;if(!c.art&&f.art)c.art=f.art}
  var lines=[];
  if(c.src.i){
    var j=await getJSON("https://itunes.apple.com/lookup?entity=song&limit=200&id="+c.src.i);
    var tr=(j.results||[]).filter(function(x){return x.wrapperType==="track"&&x.trackName});
    tr.sort(function(a,b){return (a.discNumber||1)-(b.discNumber||1)||(a.trackNumber||0)-(b.trackNumber||0)});
    var multi=tr.some(function(x){return (x.discNumber||1)>1});
    lines=tr.map(function(x){return (multi?(x.discNumber||1)+"-":"")+x.trackNumber+". "+x.trackName});
  }else if(c.src.m){
    var m=await getJSON("https://musicbrainz.org/ws/2/release?fmt=json&inc=recordings&limit=1&status=official&release-group="+c.src.m);
    var rel=(m.releases||[])[0],media=rel?rel.media||[]:[];
    media.forEach(function(d,di){(d.tracks||[]).forEach(function(t){lines.push((media.length>1?(di+1)+"-":"")+t.position+". "+t.title)})});
  }
  return lines.length?lines.join("\n"):null;
}
var tBusy={};
function setTStat(t){var e=document.getElementById("tstat");if(e)e.textContent=t}
function loadTracks(c,force){
  if(tBusy[c.id])return;tBusy[c.id]=1;setTStat("Looking up the tracklist…");
  fetchTracks(c).then(function(t){
    c.tracksTried=Date.now();
    if(t){c.tracks=t;var ta=document.querySelector('[data-cd="'+c.id+'"] [data-f=tracks]');if(ta){ta.value=t;ta.rows=Math.min(30,t.split("\n").length+1)}setTStat("")}
    else setTStat("No tracklist found. You can type one in.");
    save();paintArt(c);
  }).catch(function(){setTStat("Couldn't look it up. Check your internet connection.")})
   .then(function(){delete tBusy[c.id]});
}
var artQ=[],artBusy=false,artDown=false;
function wantArt(list){list.forEach(function(c){if(!c.art&&!c.artTried&&artQ.indexOf(c.id)<0)artQ.push(c.id)});pumpArt()}
function paintArt(c){document.querySelectorAll('[data-art="'+c.id+'"]').forEach(function(el){el.outerHTML=thumb(c)})}
function pumpArt(){
  if(artBusy||artDown||!artQ.length)return;
  var c=S.cds.find(function(x){return x.id===artQ[0]});artQ.shift();
  if(!c||c.art||c.artTried){pumpArt();return}
  artBusy=true;
  fetchArt(c).then(function(r){c.artTried=Date.now();if(r){if(r.art)c.art=r.art;c.src=r.src}save();paintArt(c)})
   .catch(function(){artDown=true;setTimeout(function(){artDown=false;pumpArt()},60000)})   // offline or rate-limited: pause a minute
   .then(function(){setTimeout(function(){artBusy=false;pumpArt()},3500)});                  // stay under Apple's ~20 requests/minute
}
window.addEventListener("online",function(){artDown=false;pumpArt()});
document.addEventListener("error",function(e){var t=e.target;if(t&&t.tagName==="IMG"&&t.parentNode&&t.parentNode.classList.contains("art"))t.parentNode.innerHTML=DISC},true);

/* ---------- views ---------- */
function spines(list){
  var n=Math.min(list.length,22);
  var out="";
  for(var i=0;i<n;i++){var c=list[i],hh=hue(c.artist+c.title),ht=26+((hh*7+i*13)%28);
    out+='<i style="height:'+ht+'px;background:hsl('+hh+' 45% '+(42+(i%3)*6)+'%)"></i>'}
  return '<div class="spines" aria-hidden="true">'+out+'</div>';
}

function home(){
  var q=ui.q.trim().toLowerCase(), h="";
  h+='<div class="bar"><h1>CD Shelves<span class="sub">'+S.cds.length+' CD'+(S.cds.length===1?"":"s")+' on '+S.shelves.length+(S.shelves.length===1?' shelf':' shelves')+'</span></h1>'
   +'<button class="icon" data-a="display" aria-label="Display settings: text size and colors">Aa</button><button class="icon" data-a="menu" aria-label="Backup and import">Backup</button></div>';
  if(S.cds.length) h+='<input class="search" id="q" type="search" placeholder="Search all CDs…" value="'+esc(ui.q)+'">';
  if(q){
    var hits=S.cds.filter(function(c){return (c.artist+" "+c.title+" "+(c.tracks||"")+" "+c.year).toLowerCase().indexOf(q)>-1}).sort(function(a,b){return cmp(a.artist,b.artist)||cmp(a.title,b.title)});
    if(!hits.length) h+='<div class="empty"><b>🔍</b>No matches</div>';
    hits.forEach(function(c){var s=shelfById(c.shelf);
      h+='<div class="cd"><button data-a="gotoCd" data-id="'+c.shelf+'">'+thumb(c)+'<span class="tx"><div class="a">'+esc(c.artist)+'</div><div class="t">'+esc(c.title)+'</div><div class="meta">on '+esc(s?s.name:"?")+'</div></span></button></div>'});
    return h;
  }
  h+='<div class="shelves">';
  S.shelves.forEach(function(s){var l=cdsOn(s.id);
    h+='<button class="shelf" data-a="open" data-id="'+s.id+'" aria-label="Shelf '+esc(s.name)+', '+l.length+' CD'+(l.length===1?"":"s")+'"><div class="nm">'+esc(s.name)+'</div><div class="ct">'+l.length+' CD'+(l.length===1?"":"s")+'</div>'+spines(l)+'</button>'});
  h+='<button class="newshelf" data-a="newShelf"><span><b>+</b>New shelf</span></button></div>';
  if(!S.shelves.length) h+='<div class="empty"><b>📀</b>Start by making your first shelf,<br>like “Shelf 1” or “Rock”.</div>';
  return h;
}

function shelfView(id){
  var s=shelfById(id), list=cdsOn(id).sort(function(a,b){return cmp(a.artist,b.artist)||cmp(a.title,b.title)});
  var h='<div class="bar"><button class="icon" data-a="back" aria-label="Back to all shelves">←</button>'
   +'<h1>'+esc(s.name)+'<span class="sub">'+list.length+' CD'+(list.length===1?"":"s")+'</span></h1>'
   +'<button class="icon" data-a="display" aria-label="Display settings: text size and colors">Aa</button><button class="icon" data-a="shelfMenu" aria-label="Shelf options">Options</button></div>';
  h+='<form class="quick" id="add" autocomplete="off"><input class="field" id="fa" placeholder="Artist" value="'+esc(ui.lastArtist||"")+'" enterkeyhint="next">'
   +'<div class="row"><input class="field" id="ft" placeholder="Album title" enterkeyhint="done"><button class="btn" type="submit">Add</button></div></form>';
  h+='<button class="btn alt scanbtn" data-a="scan">📷 Scan CD spines from a photo</button>';
  if(!list.length) h+='<div class="empty"><b>🎶</b>This shelf is empty.<br>Add your first CD above.</div>';
  var last="";
  list.forEach(function(c){

/* ---------- backup / import ---------- */
function toCSV(){
  var q=function(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var rows=["shelf,artist,title,year,notes"];
  S.shelves.forEach(function(s){cdsOn(s.id).forEach(function(c){rows.push([s.name,c.artist,c.title,c.year,c.notes].map(q).join(","))})});
  return rows.join("\n");
}
function parseCSV(t){var rows=[],r=[],c="",inq=false;
  for(var i=0;i<t.length;i++){var ch=t[i];
    if(inq){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else inq=false}else c+=ch}
    else if(ch==='"')inq=true;else if(ch===","||ch==="\t"){r.push(c);c=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);c="";if(r.some(function(x){return x.trim()}))rows.push(r);r=[]}
    else c+=ch}
  r.push(c);if(r.some(function(x){return x.trim()}))rows.push(r);return rows}
function importCSV(t){
  var rows=parseCSV(t);if(rows.length&&/^shelf$/i.test(rows[0][0].trim()))rows.shift();
  var n=0;rows.forEach(function(r){var sn=(r[0]||"").trim()||"Unsorted",a=(r[1]||"").trim(),ti=(r[2]||"").trim();if(!a&&!ti)return;
    var s=S.shelves.find(function(x){return x.name.toLowerCase()===sn.toLowerCase()});if(!s){s={id:uid(),name:sn};S.shelves.push(s)}
    S.cds.push({id:uid(),shelf:s.id,artist:a,title:ti,year:(r[3]||"").trim(),notes:(r[4]||"").trim()});n++});
  save();render();return n}
function download(){
  var u=URL.createObjectURL(new Blob([toCSV()],{type:"text/csv"})),a=document.createElement("a");
  a.href=u;a.download="cd-shelves.csv";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1500)}

/* ---------- bulk add: scan spines from photos (text reading happens on this device) ---------- */
var scan={sid:null,rows:[],busy:false,pending:0};
var gate=Promise.resolve();
function paced(fn){var run=gate.then(fn);gate=run.catch(function(){}).then(function(){return new Promise(function(r){setTimeout(r,3200)})});return run}   // stay under Apple's rate limit
function setSStat(t){var e=document.getElementById("sstat");if(e)e.textContent=t}
function scanView(sid){
  var s=shelfById(sid);
  return '<div class="bar"><button class="icon" data-a="back" aria-label="Back to shelf '+esc(s.name)+'">←</button>'
   +'<h1>Scan spines<span class="sub">Adding to '+esc(s.name)+'</span></h1>'
   +'<button class="icon" data-a="display" aria-label="Display settings: text size and colors">Aa</button></div>'
   +'<div class="quick"><p class="sub" style="margin:0">Take a bright, straight-on photo of a few spines at a time, with the writing big and in focus. You can pick several photos. Always check the list before adding.</p>'
   +'<label class="btn" for="scanfile" style="text-align:center;display:block">Take or choose photos</label>'
   +'<input type="file" id="scanfile" accept="image/*" multiple hidden></div>'
   +'<div class="sub" id="sstat" role="status" aria-live="polite" style="margin:0 0 .8rem">'+esc(scan.statusText||"")+'</div>'
   +'<div id="srows"></div>'
   +'<div class="sbar"><button class="btn" data-a="scanAdd" id="scanAddBtn" style="width:100%">Add 0 CDs</button></div>';
}
function rowStatus(r){return {looking:"Looking it up…",found:"Possible match. Check it is right.",none:"No match found. Fix the names or remove it.",dup:"Already in your collection.",dupscan:"Same album as another row.",error:"Couldn't look it up (offline?). Fix the names or remove it."}[r.status]||""}
function rowHTML(r){
  return '<div class="srow" data-row="'+r.id+'"><div class="srow-top"><label class="chk"><input type="checkbox" data-sc="ok"'+(r.checked?" checked":"")+'><span>Add</span></label>'
   +'<span class="art" aria-hidden="true">'+(r.art?'<img src="'+esc(r.art)+'" alt="" referrerpolicy="no-referrer">':DISC)+'</span></div>'
   +'<label>Artist<input class="field" data-sf="artist" value="'+esc(r.artist)+'"></label>'
   +'<label>Title<input class="field" data-sf="title" value="'+esc(r.title)+'"></label>'
   +'<div class="sub st">'+esc(rowStatus(r))+'</div><div class="sub">Read from photo: “'+esc(r.ocr)+'”</div>'
   +'<button class="btn bad" data-a="skipRow" data-id="'+r.id+'">Remove</button></div>';
}
function paintRows(){var e=document.getElementById("srows");if(e)e.innerHTML=scan.rows.map(rowHTML).join("")}
function updateBar(){var n=scan.rows.filter(function(r){return r.checked&&r.artist.trim()&&r.title.trim()}).length;
  var b=document.getElementById("scanAddBtn");if(b){b.textContent="Add "+n+" CD"+(n===1?"":"s");b.disabled=!n;b.style.opacity=n?1:.5}}
function refreshRow(r){
  var el=document.querySelector('[data-row="'+r.id+'"]');if(!el)return;
  var typing=el.contains(document.activeElement);
  if(typing){el.querySelector(".st").textContent=rowStatus(r)}else{el.outerHTML=rowHTML(r)}
  updateBar();
}
function loadTess(){return window.Tesseract?Promise.resolve():new Promise(function(res,rej){var t=document.createElement("script");t.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";t.onload=res;t.onerror=function(){rej(new Error("load"))};document.head.appendChild(t)})}
async function loadImage(f){
  try{if(window.createImageBitmap)return await createImageBitmap(f,{imageOrientation:"from-image"})}catch(e){}
  return await new Promise(function(res,rej){var u=URL.createObjectURL(f),i=new Image();i.onload=function(){res(i)};i.onerror=rej;i.src=u})
}
function baseCanvas(img){
  var w=img.width,h=img.height,k=Math.min(1,2400/Math.max(w,h)),c=document.createElement("canvas");
  c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c}
function turned(src,deg){
  var c=document.createElement("canvas"),w=src.width,h=src.height;
  if(deg===0){c.width=w;c.height=h}else{c.width=h;c.height=w}
  var x=c.getContext("2d");try{x.filter="grayscale(1) contrast(1.35)"}catch(e){}
  x.translate(c.width/2,c.height/2);x.rotate(deg*Math.PI/180);x.drawImage(src,-w/2,-h/2);return c}
function cleanLine(t){return String(t||"").replace(/[^A-Za-z0-9&'’.,!?:\-\/() ]+/g," ").replace(/\s+/g," ").trim()}
function goodLine(t,conf){
  var letters=(t.match(/[A-Za-z]/g)||[]).length;
  return conf>=50&&letters>=4&&letters/t.length>=.6&&/[A-Za-z]{2,}/.test(t)&&t.split(" ").some(function(w){return w.replace(/[^A-Za-z]/g,"").length>=3})}
async function processFiles(files){
  if(scan.busy||!files.length)return;scan.busy=true;
  var found=[];
  try{
    scan.statusText="Loading the text reader (first time only, a few MB)…";setSStat(scan.statusText);
    await loadTess();
    var worker=await Tesseract.createWorker("eng");
    for(var fi=0;fi<files.length;fi++){
      var img=await loadImage(files[fi]),base=baseCanvas(img),degs=[0,90,270];
      for(var di=0;di<degs.length;di++){
        scan.statusText="Reading photo "+(fi+1)+" of "+files.length+", pass "+(di+1)+" of 3…";setSStat(scan.statusText);
        var res=await worker.recognize(turned(base,degs[di])),d=res.data||{};
        var lines=(d.lines&&d.lines.length)?d.lines.map(function(l){return{t:cleanLine(l.text),c:l.confidence}}):String(d.text||"").split("\n").map(function(t){return{t:cleanLine(t),c:d.confidence||0}});
        lines.forEach(function(l){if(goodLine(l.t,l.c))found.push(l)});
      }
    }
    await worker.terminate();
  }catch(e){
    scan.busy=false;scan.statusText="Couldn't load or run the text reader. Check your internet connection and try again.";setSStat(scan.statusText);return}
  // de-duplicate (same text from different passes, or fragments of a longer line)
  found.sort(function(a,b){return b.c-a.c});
  var kept=[];found.forEach(function(l){var n=nrm(l.t);if(!n)return;
    if(kept.some(function(k){var m=nrm(k.t);return m===n||m.indexOf(n)>-1||n.indexOf(m)>-1}))return;kept.push(l)});
  kept=kept.slice(0,60);
  if(!kept.length){scan.busy=false;scan.statusText="I couldn't read any text. Try a closer, brighter, straight-on photo of fewer spines.";setSStat(scan.statusText);return}
  var fresh=kept.map(function(l){return{id:uid(),ocr:l.t,artist:"",title:l.t,art:"",src:null,status:"looking",checked:false}});
  scan.rows=scan.rows.concat(fresh);paintRows();updateBar();
  scan.pending+=fresh.length;scan.statusText="Found "+fresh.length+" possible CDs. Looking up each one…";setSStat(scan.statusText);
  scan.busy=false;
  fresh.forEach(function(r){matchRow(r).then(function(){refreshRow(r)}).then(function(){
    scan.pending--;if(scan.pending<=0){scan.pending=0;scan.statusText="Done. Check each CD below, then press Add.";setSStat(scan.statusText)}})});
}
async function matchRow(r){
  try{
    var j=await paced(function(){return getJSON("https://itunes.apple.com/search?media=music&entity=album&limit=6&term="+encodeURIComponent(r.ocr))});
    var toks=nrm(r.ocr).split(" ").filter(function(w){return w.length>=3}),best=null,bs=0;
    (j.results||[]).forEach(function(x){if(!x.artworkUrl100)return;var hay=" "+nrm(x.artistName+" "+x.collectionName)+" ";
      var m=toks.filter(function(t){return hay.indexOf(t)>-1}).length,sc=toks.length?m/toks.length:0;if(sc>bs&&m>=1){bs=sc;best=x}});
    if(best&&bs>=.5){
      r.artist=best.artistName;r.title=best.collectionName.replace(/\s+-\s+(Single|EP)$/i,"");
      r.art=best.artworkUrl100.replace(/\/\d+x\d+(bb)?\./,"/300x300bb.");r.src={i:best.collectionId};r.status="found";r.checked=true;
      var same=function(c){return nrm(c.artist)===nrm(r.artist)&&nrm(c.title)===nrm(r.title)};
      if(S.cds.some(same)){r.status="dup";r.checked=false}
      else if(scan.rows.some(function(o){return o!==r&&o.status==="found"&&same(o)})){r.status="dupscan";r.checked=false}
    }else{r.status="none"}
  }catch(e){r.status="error"}
}
function addScanned(){
  var sid=scan.sid,n=0;
  scan.rows.forEach(function(r){if(!r.checked||!r.artist.trim()||!r.title.trim())return;
    S.cds.push({id:uid(),shelf:sid,artist:r.artist.trim(),title:r.title.trim(),year:"",notes:"",art:r.art||"",artTried:r.art?Date.now():0,src:r.src||null});n++});
  save();scan={sid:sid,rows:[],busy:false,pending:0};
  toast("Added "+n+" CD"+(n===1?"":"s"));location.hash=sid;
}

app.addEventListener("submit",function(e){

  if(!a){document.getElementById("fa").focus();return}
  if(!t){document.getElementById("ft").focus();return}
  S.cds.push({id:uid(),shelf:sid,artist:a,title:t,year:"",notes:""});save();ui.lastArtist=a;render();
  document.getElementById("ft").focus();
});
app.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="q"){ui.q=t.value;render();return}
  if(t.dataset&&(t.dataset.sf||t.dataset.sc)){var rw=t.closest("[data-row]"),sr=rw&&scan.rows.find(function(x){return x.id===rw.dataset.row});if(!sr)return;
    if(t.dataset.sf)sr[t.dataset.sf]=t.value;else sr.checked=t.checked;updateBar();return}
  if(t.dataset&&t.dataset.f){var box=t.closest("[data-cd]"),c=S.cds.find(function(x){return x.id===box.dataset.cd});if(!c)return;
    c[t.dataset.f]=t.value;save();
    if(t.dataset.f==="shelf"){location.hash=c.shelf+"/"+c.id;toast("Moved to "+shelfById(t.value).name)}}
});
app.addEventListener("change",function(e){if(e.target.id==="scanfile"){var fl=Array.prototype.slice.call(e.target.files);e.target.value="";processFiles(fl)}});
window.addEventListener("hashchange",function(){ui.open=null;render();window.scrollTo(0,0)});

loadPrefs();load();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
})();
</script>
</body>
</html>
