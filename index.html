<!DOCTYPE html>
<html lang="en" data-theme="hcdark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CD Shelves</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CD Shelves">
<style>
:root,html[data-theme="hcdark"]{--bg:#000;--panel:#111;--panel2:#1f1f1f;--line:#fff;--ink:#fff;--mute:#e8e8e8;--acc:#ffd400;--acc-ink:#000;--danger:#ff9a8f;--bw:2px;--shelf:#ffd400}
html[data-theme="hclight"]{--bg:#fff;--panel:#fff;--panel2:#eee;--line:#000;--ink:#000;--mute:#2b2b2b;--acc:#000;--acc-ink:#fff;--danger:#b00020;--bw:2px;--shelf:#000}
html[data-theme="soft"]{--bg:#1c1814;--panel:#262019;--panel2:#2f2820;--line:#3d342a;--ink:#f3ebdd;--mute:#cfc3ae;--acc:#e8a03c;--acc-ink:#1c1814;--danger:#ff8a78;--bw:1px;--shelf:#6b4a2b}
html{font-size:var(--fs,22px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:Verdana,"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:1rem;line-height:1.5;letter-spacing:.01em;min-height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:.22rem solid var(--acc);outline-offset:.12rem}
html[data-theme="hclight"] :focus-visible{outline-color:#0050d0}
.app{max-width:44rem;margin:0 auto;padding:0 1rem 6rem}

.bar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;padding:.8rem 0 .7rem;border-bottom:var(--bw) solid var(--line);margin-bottom:1rem}
.bar h1{margin:0;font-size:1.5rem;line-height:1.2;flex:1 1 8rem;min-width:8rem;overflow-wrap:anywhere}
.bar .icon{order:2}.bar h1{order:1}.bar .icon[data-a=back]{order:0}
.bar .sub{display:block;font-size:.9rem;font-weight:400;color:var(--mute);letter-spacing:0;margin-top:.1rem}
.icon{min-width:3.2rem;height:3.2rem;border-radius:.8rem;background:var(--panel);border:var(--bw) solid var(--line);display:grid;place-items:center;font-size:1.15rem;font-weight:700;flex:none;padding:0 .4rem}
.icon:active{background:var(--panel2)}

.shelves{display:grid;grid-template-columns:1fr;gap:1rem}
.shelf{background:var(--panel);border-radius:1rem;padding:1rem 1rem 0;text-align:left;display:block;width:100%;border:var(--bw) solid var(--line);overflow:hidden}
.shelf:active{background:var(--panel2)}
.shelf .nm{font-weight:700;font-size:1.3rem;line-height:1.25;overflow-wrap:anywhere}
.shelf .ct{color:var(--mute);font-size:1rem;margin-bottom:.8rem}
.spines{display:flex;align-items:flex-end;gap:.15rem;height:2.6rem;border-bottom:.5rem solid var(--shelf);margin:0 -1rem;padding:0 1rem}
.spines i{display:block;width:.4rem;border-radius:2px 2px 0 0}
html:not([data-theme="soft"]) .spines i{background:var(--acc)!important}
.newshelf{border:var(--bw) dashed var(--line);background:none;color:var(--ink);min-height:6rem;display:grid;place-items:center;border-radius:1rem;font-size:1.25rem;font-weight:700;width:100%}
.newshelf b{display:block;font-size:2.2rem;color:var(--acc);line-height:1}

.search,.field{width:100%;min-width:0;background:var(--bg);border:var(--bw) solid var(--line);border-radius:.7rem;padding:.7rem .8rem;min-height:3.2rem}
.search{margin:0 0 1rem}
.search::placeholder,.field::placeholder{color:var(--mute);opacity:1}

.quick{background:var(--panel);border:var(--bw) solid var(--line);border-radius:1rem;padding:.8rem;margin:0 0 1rem;display:grid;gap:.6rem}
.quick .row,.edit .row{display:flex;gap:.6rem}
.btn{background:var(--acc);color:var(--acc-ink);font-weight:700;border-radius:.7rem;padding:.7rem 1rem;white-space:nowrap;min-height:3.2rem;border:var(--bw) solid var(--acc)}
.btn.alt{background:var(--panel2);color:var(--ink);border-color:var(--line);font-weight:600}
.btn.bad{background:none;color:var(--danger);border:var(--bw) solid var(--danger)}
.letter{font-size:1.15rem;font-weight:800;color:var(--acc);margin:1.2rem .2rem .4rem;border-bottom:var(--bw) solid var(--line)}
html[data-theme="hclight"] .letter{color:#000}
.cd{background:var(--panel);border:var(--bw) solid var(--line);border-radius:.8rem;margin-bottom:.5rem;overflow:hidden}
.cd>button{display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;padding:.6rem .9rem .6rem .6rem;min-height:3.4rem}
.cd .tx{flex:1;min-width:0}
.art{flex:none;width:min(4.2rem,22vw);aspect-ratio:1;border-radius:.4rem;overflow:hidden;border:1px solid var(--line);background:var(--panel2);display:grid;place-items:center;color:var(--mute)}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art svg{width:70%;height:70%}
.artrow{display:flex;gap:.6rem}.artrow .btn{flex:1;white-space:normal;font-size:.9rem;padding:.5rem .6rem}
.cd .a{color:var(--mute);font-size:.95rem}
.cd .t{font-weight:700;font-size:1.15rem;line-height:1.3;overflow-wrap:anywhere}
.cd .meta{color:var(--mute);font-size:.9rem}
.edit{padding:.6rem .9rem 1rem;display:grid;gap:.7rem;border-top:var(--bw) solid var(--line)}
.edit label,.sheet label{font-size:.95rem;color:var(--ink);display:grid;gap:.25rem;font-weight:600}
.lost{font-size:1.15rem;margin:1.4rem 0 .6rem;padding-top:.8rem;border-top:var(--bw) solid var(--line)}
.cand{display:flex;align-items:center;gap:.8rem;text-align:left;width:100%}
.cand .art{flex:none}
.scanbtn{width:100%;margin:0 0 1rem}
.srow{background:var(--panel);border:var(--bw) solid var(--line);border-radius:1rem;padding:.8rem;margin-bottom:.8rem;display:grid;gap:.6rem}
.srow label{font-size:.95rem;font-weight:600;display:grid;gap:.25rem}
.srow-top{display:flex;align-items:center;justify-content:space-between;gap:.8rem}
.chk{display:flex!important;align-items:center;gap:.6rem;font-size:1.15rem!important}
.chk input{width:1.9rem;height:1.9rem;accent-color:var(--acc)}
.sbar{position:fixed;left:0;right:0;bottom:0;padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom));background:var(--bg);border-top:var(--bw) solid var(--line);max-width:44rem;margin:0 auto;z-index:6}
.cd .go{flex:none;font-size:1.8rem;color:var(--mute);line-height:1}
.hero{display:grid;place-items:center;margin:.2rem 0 1.2rem}
.hero .art{width:min(15rem,70vw);border-radius:.7rem;border:var(--bw) solid var(--line)}
.detail{display:grid;gap:.9rem}
.detail label{font-size:.95rem;font-weight:600;display:grid;gap:.25rem}
.edit .row:not(:last-child){flex-direction:column}
.empty{text-align:center;color:var(--mute);padding:2.5rem .6rem;font-size:1.1rem}
.empty b{display:block;font-size:2.4rem;margin-bottom:.4rem}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;justify-content:center;z-index:20;overflow-y:auto}
.sheet{background:var(--panel);width:100%;max-width:34rem;max-height:92dvh;overflow-y:auto;border-radius:1.2rem 1.2rem 0 0;padding:1.2rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom));display:grid;gap:.8rem;border:var(--bw) solid var(--line);border-bottom:0}
.sheet h2{margin:0;font-size:1.4rem;line-height:1.25}
.sheet p{margin:0;color:var(--mute);font-size:1rem}
.sheet .row{display:flex;gap:.6rem}.sheet .row>*{flex:1}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--acc);color:var(--acc-ink);font-weight:700;
  padding:.8rem 1.2rem;border-radius:.8rem;font-size:1.05rem;z-index:30;max-width:92vw;text-align:center;border:var(--bw) solid var(--bg)}
textarea.field{min-height:7rem;font-family:ui-monospace,Menlo,monospace;font-size:.85rem}
textarea.tracks{font-family:inherit;font-size:1rem;line-height:1.6;resize:vertical}
.menu{display:grid;gap:.6rem}
.menu button.item{display:block;width:100%;text-align:left;padding:.8rem 1rem;background:var(--panel2);border:var(--bw) solid var(--line);border-radius:.7rem;min-height:3.4rem;font-weight:600}
.opts{display:grid;gap:.5rem}
.opt{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;padding:.7rem .9rem;border:var(--bw) solid var(--line);border-radius:.7rem;min-height:3.4rem;font-weight:600;background:var(--panel2)}
.opt[aria-pressed="true"]{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.opt .sw{width:1.6rem;height:1.6rem;border-radius:.3rem;border:2px solid #888;flex:none}
@media(min-width:720px){.shelves{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function(){
"use strict";
var KEY="cdshelves.v1", OLD="cdlog.v1";
var S={shelves:[],cds:[],del:{}};            // state
var ui={open:null,q:"",sheet:null};   // open = id of cd being edited
var app=document.getElementById("app");
var PK="cdshelves.prefs",P={theme:"hcdark",size:22};
var SIZES=[["Large",22],["Extra large",28],["Huge",34],["Standard",18]];
var THEMES=[["hcdark","Black background, yellow and white","#000"],["hclight","White background, black text","#fff"],["soft","Soft dark (original)","#1c1814"]];
function loadPrefs(){try{var p=JSON.parse(localStorage.getItem(PK)||"null");if(p){P.theme=p.theme||P.theme;P.size=p.size||P.size}}catch(e){}applyPrefs()}
function applyPrefs(){var d=document.documentElement;d.setAttribute("data-theme",P.theme);d.style.setProperty("--fs",P.size+"px");
  var m=document.querySelector('meta[name=theme-color]');if(m)m.content=({hcdark:"#000000",hclight:"#ffffff",soft:"#1c1814"})[P.theme]||"#000000";
  try{localStorage.setItem(PK,JSON.stringify(P))}catch(e){}}

/* ---------- storage ---------- */
function load(){
  try{var d=JSON.parse(localStorage.getItem(KEY)||"null"); if(d&&d.shelves){S=d;S.del=S.del||{};initSnap();return}}catch(e){}
  // migrate earlier flat list if present
  try{
    var old=JSON.parse(localStorage.getItem(OLD)||"[]");
    if(old.length){var sh={id:uid(),name:"Unsorted"};S.shelves=[sh];
      S.cds=old.map(function(o){return{id:o.id||uid(),shelf:sh.id,artist:o.artist||"",title:o.title||"",year:o.year||"",notes:o.notes||""}});save()}
  }catch(e){}
}
function save(){stamp();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Couldn't save — storage is full or blocked")}schedSync()}

/* ---------- sync between devices (private GitHub gist) ---------- */
var SK="cdshelves.sync",SFILE="cd-shelves-data.json",sync={cfg:null,busy:false,timer:null,msg:""},snap={};
function loadSyncCfg(){try{sync.cfg=JSON.parse(localStorage.getItem(SK)||"null")}catch(e){sync.cfg=null}}
function saveSyncCfg(){try{if(sync.cfg)localStorage.setItem(SK,JSON.stringify(sync.cfg));else localStorage.removeItem(SK)}catch(e){}}
function stripMod(o){var c={};for(var k in o)if(k!=="mod")c[k]=o[k];return JSON.stringify(c)}
function initSnap(){snap={};["shelves","cds"].forEach(function(t){S[t].forEach(function(o){snap[o.id]=stripMod(o)})})}
function stamp(){   // note when each shelf/CD last changed, and remember deletions, so two devices can be merged
  var now=Date.now(),ids={};S.del=S.del||{};
  ["shelves","cds"].forEach(function(t){S[t].forEach(function(o){ids[o.id]=1;var j=stripMod(o);if(snap[o.id]!==j||!o.mod){o.mod=now;snap[o.id]=j}})});
  Object.keys(snap).forEach(function(id){if(!ids[id]){S.del[id]=now;delete snap[id]}});
  Object.keys(S.del).forEach(function(id){if(now-S.del[id]>60*864e5)delete S.del[id]});
}
function mergeData(L,R){
  var del={};[L.del||{},R.del||{}].forEach(function(d){Object.keys(d).forEach(function(k){del[k]=Math.max(del[k]||0,d[k])})});
  var out={shelves:[],cds:[],del:del};
  ["shelves","cds"].forEach(function(t){var m={},order=[];
    (L[t]||[]).concat(R[t]||[]).forEach(function(o){var p=m[o.id];if(!p){order.push(o.id);m[o.id]=o}else if((o.mod||0)>(p.mod||0))m[o.id]=o});
    order.forEach(function(id){if(del[id]&&del[id]>(m[id].mod||0))return;out[t].push(m[id])})});
  var sh={};out.shelves.forEach(function(x){sh[x.id]=1});out.cds=out.cds.filter(function(c){return sh[c.shelf]});
  return out}
function canon(d){var f=function(a){return (a||[]).slice().sort(function(x,y){return x.id<y.id?-1:1})};
  var dl=d.del||{},dk={};Object.keys(dl).sort().forEach(function(k){dk[k]=dl[k]});return JSON.stringify([f(d.shelves),f(d.cds),dk])}
async function gh(path,opt){
  opt=opt||{};var r=await fetch("https://api.github.com"+path,{method:opt.method||"GET",headers:{Authorization:"Bearer "+sync.cfg.token,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:opt.body?JSON.stringify(opt.body):undefined});
  if(!r.ok){var e=new Error("gh "+r.status);e.status=r.status;throw e}return r.json()}
async function findGist(){
  if(sync.cfg.gist)return sync.cfg.gist;
  for(var pg=1;pg<=3;pg++){var l=await gh("/gists?per_page=100&page="+pg);
    var g=l.find(function(x){return x.files&&x.files[SFILE]});if(g){sync.cfg.gist=g.id;saveSyncCfg();return g.id}
    if(l.length<100)break}
  return null}
async function readGist(id){
  var g=await gh("/gists/"+id),f=g.files&&g.files[SFILE];if(!f)return null;
  var txt=f.content;if(f.truncated||txt==null){var r=await fetch(f.raw_url);txt=await r.text()}
  var d=JSON.parse(txt);return d&&d.shelves?d:null}
async function writeGist(id,data){
  var files={};files[SFILE]={content:JSON.stringify(data)};
  if(id){await gh("/gists/"+id,{method:"PATCH",body:{files:files}});return id}
  var g=await gh("/gists",{method:"POST",body:{description:"CD Shelves data (private, do not delete)",public:false,files:files}});
  sync.cfg.gist=g.id;saveSyncCfg();return g.id}
function schedSync(){if(!sync.cfg)return;clearTimeout(sync.timer);sync.timer=setTimeout(function(){syncNow()},6000)}
async function syncNow(){
  if(!sync.cfg||sync.busy)return;sync.busy=true;sync.msg="Syncing…";
  try{
    stamp();
    var id=await findGist(),remote=null;
    if(id){try{remote=await readGist(id)}catch(e){if(e.status===404){sync.cfg.gist=null;saveSyncCfg();id=await findGist();remote=id?await readGist(id):null}else throw e}}
    var local={shelves:S.shelves,cds:S.cds,del:S.del||{}},merged=remote?mergeData(local,remote):local;
    if(!remote||canon(merged)!==canon(remote))await writeGist(id,merged);
    if(canon(merged)!==canon(local)){
      S={shelves:merged.shelves,cds:merged.cds,del:merged.del};initSnap();
      try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
      var a=document.activeElement;if(!document.getElementById("scrim")&&(!a||a===document.body||a.tagName==="BUTTON"))render()}
    sync.cfg.last=Date.now();saveSyncCfg();sync.msg="Synced just now."
  }catch(e){
    sync.msg=e.status===401?"GitHub didn't accept the token. Disconnect and enter a new one.":(e.status===403||e.status===404)?"The token can't use gists. Make a new one with the \"gist\" box ticked.":"Couldn't reach GitHub (offline?). It will try again later."}
  sync.busy=false;var el=document.getElementById("syncstat");if(el)el.textContent=syncStatus()}
function syncStatus(){return sync.msg+(sync.cfg&&sync.cfg.last&&sync.msg.indexOf("Synced")===0?"":sync.cfg&&sync.cfg.last?" Last synced "+new Date(sync.cfg.last).toLocaleString()+".":"")}
function syncSheet(){
  var d;
  if(sync.cfg){
    d=sheet('<h2>Sync between devices</h2><p>This device is connected. Changes sync by themselves when you open the app and a few seconds after you change something.</p><p id="syncstat" role="status">'+esc(syncStatus())+'</p>'
      +'<div class="menu"><button class="item" id="sn">⟳ Sync now</button><button class="item" id="sd">✕ Disconnect this device</button></div><button class="btn alt" id="x" style="width:100%">Close</button>');
    d.querySelector("#sn").onclick=function(){syncNow()};
    d.querySelector("#sd").onclick=function(){sync.cfg=null;saveSyncCfg();sync.msg="";closeSheet();toast("Disconnected. Your CDs stay on this device.")};
  }else{
    d=sheet('<h2>Sync between devices</h2><p>Your shelves are saved in a private file in <b>your own GitHub account</b>. Do these steps once on each device:</p>'
      +'<ol><li>Open <a href="https://github.com/settings/tokens/new?scopes=gist&amp;description=CD+Shelves" target="_blank" rel="noopener">this GitHub page</a> and sign in.</li>'
      +'<li>Leave only the <b>gist</b> box ticked. Press <b>Generate token</b> at the bottom.</li><li>Copy the token it shows (it starts with ghp_) and paste it below.</li></ol>'
      +'<label>Token<input class="field" id="tk" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ghp_…"></label>'
      +'<p id="syncstat" role="status"></p><div class="row"><button class="btn alt" id="x">Cancel</button><button class="btn" id="ok">Connect</button></div>');
    d.querySelector("#ok").onclick=function(){var t=d.querySelector("#tk").value.trim();if(!t){d.querySelector("#syncstat").textContent="Paste the token first.";return}
      sync.cfg={token:t,gist:null,last:0};saveSyncCfg();d.querySelector("#syncstat").textContent="Connecting…";
      syncNow().then(function(){if(sync.msg.indexOf("Synced")===0){closeSheet();toast("Connected. Your shelves are syncing.")}else{var m=sync.msg;sync.cfg=null;saveSyncCfg();var e=document.getElementById("syncstat");if(e)e.textContent=m}})}}
  var x=d.querySelector("#x");if(x)x.onclick=closeSheet}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function byShelf(a,b){var ya=parseInt(a.year,10)||9999,yb=parseInt(b.year,10)||9999;return cmp(a.artist,b.artist)||ya-yb||cmp(a.title,b.title)}
function cmp(a,b){return String(a||"").toLowerCase().localeCompare(String(b||"").toLowerCase(),undefined,{numeric:true})}
function shelfById(id){return S.shelves.find(function(s){return s.id===id})}
function cdsOn(id){return S.cds.filter(function(c){return c.shelf===id})}
function hue(str){var h=0;for(var i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))>>>0;return h%360}
function route(){var h=location.hash.slice(1).split("/")[0];return h&&shelfById(h)?h:null}
function routeScan(){var p=location.hash.slice(1).split("/");return !!route()&&p[1]==="scan"}
function routeCd(){var p=location.hash.slice(1).split("/");var sid=route();return sid&&p[1]?(S.cds.find(function(c){return c.id===p[1]&&c.shelf===sid})||null):null}
function go(id){ui.open=null;ui.q="";location.hash=id||"";if(!id)render()}
var toastT;function toast(t){var e=document.createElement("div");e.className="toast";e.setAttribute("role","status");e.textContent=t;document.body.appendChild(e);clearTimeout(toastT);setTimeout(function(){e.remove()},4500)}


/* ---------- cover art (Apple iTunes Search API, looked up on this device) ---------- */
var DISC='<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="24" cy="24" r="7" fill="none" stroke="currentColor" stroke-width="3"/></svg>';
function thumb(c){return '<span class="art" data-art="'+c.id+'" aria-hidden="true">'+(c.art?'<img src="'+esc(c.art)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':DISC)+'</span>'}
function nrm(x){return String(x||"").toLowerCase().replace(/\(.*?\)|\[.*?\]/g," ").replace(/&/g," and ").replace(/^the /,"").replace(/[^a-z0-9]+/g," ").trim()}
function close(a,b){a=nrm(a);b=nrm(b);return !!a&&!!b&&(a===b||a.indexOf(b)>-1||b.indexOf(a)>-1)}
async function lookup(term,c){
  var r=await fetch("https://itunes.apple.com/search?media=music&entity=album&limit=8&term="+encodeURIComponent(term));
  if(!r.ok)throw new Error("http "+r.status);
  var j=await r.json(), hits=(j.results||[]).filter(function(x){return x.artworkUrl100});
  var best=hits.find(function(x){return nrm(x.collectionName)===nrm(c.title)&&close(x.artistName,c.artist)})
        ||hits.find(function(x){return close(x.collectionName,c.title)&&close(x.artistName,c.artist)});
  return best?{art:best.artworkUrl100.replace(/\/\d+x\d+(bb)?\./,"/300x300bb."),src:{i:best.collectionId}}:null;
}
// fallback: MusicBrainz + Cover Art Archive (covers albums missing from Apple's catalog)
async function mbLookup(c){
  var q='releasegroup:"'+c.title.replace(/["\\]/g," ")+'" AND artist:"'+c.artist.replace(/["\\]/g," ")+'" AND primarytype:album';
  var r=await fetch("https://musicbrainz.org/ws/2/release-group/?fmt=json&limit=8&query="+encodeURIComponent(q));
  if(!r.ok)throw new Error("http "+r.status);

async function fetchArt(c){   // -> {art, src} or null

async function getJSON(url,retries){

async function fetchTracks(c){   // -> text, one track per line, or null
  if(!c.src){var f=await fetchArt(c);if(!f)return null;c.src=f.src;if(!c.art&&f.art)c.art=f.art}
  var lines=[];
  if(c.src.i){
    var j=await getJSON("https://itunes.apple.com/lookup?entity=song&limit=200&id="+c.src.i);
    var tr=(j.results||[]).filter(function(x){return x.wrapperType==="track"&&x.trackName});
    tr.sort(function(a,b){return (a.discNumber||1)-(b.discNumber||1)||(a.trackNumber||0)-(b.trackNumber||0)});
    var multi=tr.some(function(x){return (x.discNumber||1)>1});
    lines=tr.map(function(x){return (multi?(x.discNumber||1)+"-":"")+x.trackNumber+". "+x.trackName});

    var m=await getJSON("https://musicbrainz.org/ws/2/release?fmt=json&inc=recordings&limit=1&status=official&release-group="+c.src.m);
    var rel=(m.releases||[])[0],media=rel?rel.media||[]:[];

async function findYear(c){
  var d=null;
  if(c.src&&c.src.i){var j=await paced(function(){return getJSON("https://itunes.apple.com/lookup?id="+c.src.i)});d=j.results&&j.results[0]&&j.results[0].releaseDate}
  else if(c.src&&c.src.m){var m=await paced(function(){return getJSON("https://musicbrainz.org/ws/2/release-group/"+c.src.m+"?fmt=json",2)});d=m["first-release-date"]}
  if(!d){var q=await paced(function(){return getJSON("https://itunes.apple.com/search?media=music&entity=album&limit=10&term="+encodeURIComponent(c.artist+" "+c.title))});
    var t=nrm(tidyTitle(c.title)),a=nrm(c.artist);
    var h=(q.results||[]).filter(function(x){return nrm(x.artistName)===a&&nrm(tidyTitle(x.collectionName))===t})[0];if(h)d=h.releaseDate}

function pumpYears(){

  var c=S.cds.find(function(x){return x.id===yearQ[0]});yearQ.shift();

   .catch(function(){yearQ=[]})

function pumpArt(){
  if(artBusy||artDown||!artQ.length)return;

   .catch(function(){artDown=true;setTimeout(function(){artDown=false;pumpArt()},60000)})   // offline or rate-limited: pause a minute
   .then(function(){setTimeout(function(){artBusy=false;pumpArt()},3500)});                  // stay under Apple's ~20 requests/minute

function toCSV(){
  var q=function(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var rows=["shelf,artist,title,year,notes"];
  S.shelves.forEach(function(s){cdsOn(s.id).forEach(function(c){rows.push([s.name,c.artist,c.title,c.year,c.notes].map(q).join(","))})});
  return rows.join("\n");
}
function parseCSV(t){var rows=[],r=[],c="",inq=false;
  for(var i=0;i<t.length;i++){var ch=t[i];
    if(inq){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else inq=false}else c+=ch}
    else if(ch==='"')inq=true;else if(ch===","||ch==="\t"){r.push(c);c=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);c="";if(r.some(function(x){return x.trim()}))rows.push(r);r=[]}
    else c+=ch}
  r.push(c);if(r.some(function(x){return x.trim()}))rows.push(r);return rows}
function importCSV(t){
  var rows=parseCSV(t);if(rows.length&&/^shelf$/i.test(rows[0][0].trim()))rows.shift();
  var n=0;rows.forEach(function(r){var sn=(r[0]||"").trim()||"Unsorted",a=(r[1]||"").trim(),ti=(r[2]||"").trim();if(!a&&!ti)return;
    var s=S.shelves.find(function(x){return x.name.toLowerCase()===sn.toLowerCase()});if(!s){s={id:uid(),name:sn};S.shelves.push(s)}
    S.cds.push({id:uid(),shelf:s.id,artist:a,title:ti,year:(r[3]||"").trim(),notes:(r[4]||"").trim()});n++});
  save();render();return n}
function download(){
  var u=URL.createObjectURL(new Blob([toCSV()],{type:"text/csv"})),a=document.createElement("a");
  a.href=u;a.download="cd-shelves.csv";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1500)}

  try{
    var j=await paced(function(){return getJSON("https://itunes.apple.com/search?media=music&entity=album&limit=25&term="+encodeURIComponent(text))});
    var best=null,bs=0,sure=false,ntext=nrm(text);
    (j.results||[]).forEach(function(x){if(!x.artworkUrl100)return;
      var ah=" "+nrm(x.artistName)+" ",th=" "+nrm(x.collectionName)+" ",sc,full=false;
      if(parts.length===2){                                   // one line must be the artist and the other the title, in either order
        var f1=[fracT(parts[0],ah),fracT(parts[1],th)],f2=[fracT(parts[1],ah),fracT(parts[0],th)];
        var m1=Math.min(f1[0],f1[1]),m2=Math.min(f2[0],f2[1]);
        sc=Math.max(m1,m2);if(sc<.5)return;sc=Math.max((f1[0]+f1[1])/2*(m1>=.5),(f2[0]+f2[1])/2*(m2>=.5));
      }else{
        var hay=" "+nrm(x.artistName+" "+x.collectionName)+" ";sc=fracT(parts[0],hay);if(sc<.5)return;
        var an=nrm(x.artistName),rest=ntext.indexOf(an+" ")===0?ntext.slice(an.length+1):"";   // line starts with the artist, then the title
        if(rest&&fracT(rest,th)>=.8&&fracT(nrm(tidyTitle(x.collectionName))," "+rest+" ")>=.6){full=true;sc+=1}
      }
      if(sc>bs){bs=sc;best=x;sure=full}});
    var pick=null,confident=!single||sure;
    if(best&&bs>=.6)pick={artist:best.artistName,title:best.collectionName,art:best.artworkUrl100.replace(/\/\d+x\d+(bb)?\./,"/300x300bb."),src:{i:best.collectionId},year:String(best.releaseDate||"").slice(0,4)};
    else if(parts.length===2){
      // artist part may be misread or clipped ("LAYER" for "SLAYER"): search by the album title alone and check the artist loosely
      var tj=await paced(function(){return getJSON("https://itunes.apple.com/search?media=music&entity=album&limit=25&term="+encodeURIComponent(parts[1]))});
      var tb=(tj.results||[]).filter(function(x){return x.artworkUrl100&&fracT(parts[1]," "+nrm(tidyTitle(x.collectionName))+" ")>=.8&&fracT(nrm(tidyTitle(x.collectionName)),nrm(parts[1]))>=.6&&fracT(parts[0]," "+nrm(x.artistName)+" ")>=.5})[0];
      if(tb)pick={artist:tb.artistName,title:tb.collectionName,art:tb.artworkUrl100.replace(/\/\d+x\d+(bb)?\./,"/300x300bb."),src:{i:tb.collectionId}};
      else pick=await mbPair(parts,fracT);     // Apple doesn't carry every album: try MusicBrainz
    }
    else if(single&&text.split(" ").length>=2){pick=await mbSplit(text);if(pick)confident=true}
    if(pick){
      r.artist=pick.artist;r.year=pick.year||"";r.title=tidyTitle(pick.title);r.art=pick.art||"";r.src=pick.src;
      r.status=confident?"found":"weak";r.checked=confident;
      var same=function(c){return nrm(c.artist)===nrm(r.artist)&&nrm(c.title)===nrm(r.title)};
      if(S.cds.some(same)){r.status="dup";r.checked=false}
      else if(scan.rows.some(function(o){return same(o)&&o.artist})){r.status="dupscan";r.checked=false}
    }
  }catch(e){r.status="error"}
  if(!r.artist&&single){var w2=parts[0].split(" ").filter(Boolean);if(w2.length===2){r.artist=w2[0];r.title=w2[1]}}   // best guess for "ARTIST TITLE"; you can edit it
  return r;
}
function addScanned(){
  var sid=scan.sid,n=0;
  scan.rows.forEach(function(r){if(!r.checked||!r.artist.trim()||!r.title.trim())return;
    S.cds.push({id:uid(),shelf:sid,artist:r.artist.trim(),title:r.title.trim(),year:r.year||"",notes:"",art:r.art||"",artTried:r.art?Date.now():0,src:r.src||null});n++});
  save();scan={sid:sid,rows:[],cards:[],busy:false};
  toast("Added "+n+" CD"+(n===1?"":"s"));location.hash=sid;
}

/* ---------- events ---------- */
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,id=b.dataset.id;
  if(a==="open"||a==="gotoCd")go(id);
  else if(a==="back"){var sh=route();if((routeCd()||routeScan())&&sh)location.hash=sh;else go(null)}
  else if(a==="newShelf")askName("New shelf","","Create",function(v){var s={id:uid(),name:v};S.shelves.push(s);save();go(s.id)});
  else if(a==="menu")mainMenu();
  else if(a==="display")displaySheet();
  else if(a==="shelfMenu")shelfMenu(route());
  else if(a==="openCd"){location.hash=route()+"/"+id}
  else if(a==="artistGo"){findArtist()}
  else if(a==="scan"){location.hash=route()+"/scan"}
  else if(a==="scanAdd")addScanned();
  else if(a==="pickCand"||a==="manualCand"||a==="dropCard"){
    var k=scan.cards.find(function(x){return x.id===id});if(!k)return;
    if(a==="pickCand"){var c=k.cands[+b.dataset.i];addRow({id:uid(),ocr:"Front cover photo",artist:c.artist,title:tidyTitle(c.title),year:c.year,art:c.art,src:c.src,status:"found",checked:true})}
    else if(a==="manualCand")addRow({id:uid(),ocr:k.ocr||"Front cover photo",artist:"",title:"",art:"",src:null,status:"none",checked:false});
    scan.cards=scan.cards.filter(function(x){return x.id!==id});paintCards()}
  else if(a==="skipRow"){scan.rows=scan.rows.filter(function(r){return r.id!==id});var e=document.querySelector('[data-row="'+id+'"]');if(e)e.remove();updateBar()}
  else if(a==="findArt"){var c=S.cds.find(function(x){return x.id===id});if(!c)return;toast("Looking for the cover…");
    fetchArt(c).then(function(r){c.artTried=Date.now();if(r)c.src=r.src;if(r&&r.art){c.art=r.art;save();paintArt(c);toast("Cover found");render()}else{save();toast("No matching cover found")}}).catch(function(){toast("Couldn't look it up. Check your internet connection.")})}
  else if(a==="findTracks"){var c3=S.cds.find(function(x){return x.id===id});if(!c3)return;
    if(c3.tracks&&c3.tracks.trim())confirmSheet("Replace tracklist?","This will replace what is written now with a fresh lookup.","Replace",function(){c3.src=null;loadTracks(c3,true)});
    else{c3.src=null;loadTracks(c3,true)}}
  else if(a==="noArt"){var c2=S.cds.find(function(x){return x.id===id});if(c2){c2.art="";c2.artTried=Date.now();save();render()}}
  else if(a==="delCd"){var dc=S.cds.find(function(x){return x.id===id});confirmSheet("Delete this CD?",(dc?"“"+esc(dc.title)+"” by "+esc(dc.artist)+". ":"")+"This can't be undone.","Yes, delete it",function(){var sh=route();S.cds=S.cds.filter(function(c){return c.id!==id});save();if(sh)location.hash=sh;else render()})}
});
app.addEventListener("submit",function(e){
  if(e.target.id!=="add")return;e.preventDefault();
  var sid=route(),a=document.getElementById("fa").value.trim(),t=document.getElementById("ft").value.trim();
  if(!a){document.getElementById("fa").focus();return}
  if(!t){document.getElementById("ft").focus();return}
  S.cds.push({id:uid(),shelf:sid,artist:a,title:t,year:"",notes:""});save();ui.lastArtist=a;render();
  document.getElementById("ft").focus();
});
app.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="q"){ui.q=t.value;render();return}
  if(t.dataset&&(t.dataset.sf||t.dataset.sc)){var rw=t.closest("[data-row]"),sr=rw&&scan.rows.find(function(x){return x.id===rw.dataset.row});if(!sr)return;
    if(t.dataset.sf)sr[t.dataset.sf]=t.value;else sr.checked=t.checked;updateBar();return}
  if(t.dataset&&t.dataset.f){var box=t.closest("[data-cd]"),c=S.cds.find(function(x){return x.id===box.dataset.cd});if(!c)return;
    c[t.dataset.f]=t.value;save();
    if(t.dataset.f==="shelf"){location.hash=c.shelf+"/"+c.id;toast("Moved to "+shelfById(t.value).name)}}
});
app.addEventListener("change",function(e){if(e.target.id==="coverfile"){var cf=e.target.files[0];e.target.value="";if(cf)processCover(cf)}
  if(e.target.id==="scanfile"){var fl=Array.prototype.slice.call(e.target.files);e.target.value="";processFiles(fl)}});
window.addEventListener("hashchange",function(){ui.open=null;render();window.scrollTo(0,0)});

loadPrefs();load();loadSyncCfg();render();
if(sync.cfg){syncNow();document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")syncNow()})}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
})();
</script>
