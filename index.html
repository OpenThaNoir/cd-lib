<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CD Shelves</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#1c1814">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CD Shelves">
<style>
:root{
  --bg:#1c1814;--panel:#262019;--panel2:#2f2820;--line:#3d342a;
  --ink:#f3ebdd;--mute:#a69a86;--acc:#e8a03c;--acc-ink:#1c1814;--danger:#e0624f;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{max-width:720px;margin:0 auto;padding:0 16px 96px}

/* top bar */
.bar{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 80%,transparent);
  display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.bar h1{margin:0;font-size:24px;letter-spacing:-.02em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .sub{display:block;font-size:13px;font-weight:400;color:var(--mute);letter-spacing:0}
.icon{width:42px;height:42px;border-radius:12px;background:var(--panel);display:grid;place-items:center;font-size:18px;flex:none}
.icon:active{background:var(--panel2)}

/* shelves grid */
.shelves{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.shelf{background:var(--panel);border-radius:var(--r);padding:14px 14px 0;text-align:left;display:block;width:100%;
  border:1px solid var(--line);overflow:hidden}
.shelf:active{transform:scale(.985)}
.shelf .nm{font-weight:650;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shelf .ct{color:var(--mute);font-size:13px;margin-bottom:12px}
.spines{display:flex;align-items:flex-end;gap:2px;height:54px;padding:0 2px;
  border-bottom:9px solid #6b4a2b;margin:0 -14px;padding-left:14px;padding-right:14px;
  background:linear-gradient(transparent 60%,rgba(0,0,0,.18))}
.spines i{display:block;width:7px;border-radius:2px 2px 0 0}
.newshelf{border:2px dashed var(--line);background:none;color:var(--mute);min-height:128px;display:grid;place-items:center;
  border-radius:var(--r);font-size:16px;width:100%}
.newshelf b{display:block;font-size:28px;color:var(--acc);line-height:1}

/* search */
.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin:2px 0 14px}
.search:focus,.field:focus{outline:2px solid var(--acc);outline-offset:-1px}

/* shelf view */
.quick{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:2px 0 16px;display:grid;gap:8px}
.quick .row{display:flex;gap:8px}
.field{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.btn{background:var(--acc);color:var(--acc-ink);font-weight:700;border-radius:10px;padding:11px 16px;white-space:nowrap}
.btn.alt{background:var(--panel2);color:var(--ink);font-weight:500}
.btn.bad{background:none;color:var(--danger);border:1px solid var(--line)}
.letter{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--acc);margin:18px 2px 6px}
.cd{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;overflow:hidden}
.cd>button{display:block;width:100%;text-align:left;padding:11px 14px}
.cd .a{color:var(--mute);font-size:13px}
.cd .t{font-weight:600}
.cd .meta{color:var(--mute);font-size:12px}
.edit{padding:4px 14px 14px;display:grid;gap:8px;border-top:1px solid var(--line)}
.edit label{font-size:12px;color:var(--mute);display:grid;gap:3px}
.edit .row{display:flex;gap:8px}
.empty{text-align:center;color:var(--mute);padding:44px 10px}
.empty b{display:block;font-size:38px;margin-bottom:6px}

/* sheet / dialog */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--panel);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));display:grid;gap:12px;
  border:1px solid var(--line);border-bottom:0}
.sheet h2{margin:0;font-size:20px}
.sheet p{margin:0;color:var(--mute);font-size:14px}
.sheet .row{display:flex;gap:8px}
.sheet .row>*{flex:1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:99px;font-size:14px;z-index:30;box-shadow:0 6px 24px rgba(0,0,0,.4)}
textarea.field{min-height:100px;font:13px ui-monospace,Menlo,monospace}
.menu button.item{display:block;width:100%;text-align:left;padding:13px 14px;background:var(--panel2);border-radius:10px}
.menu{display:grid;gap:8px}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function(){
"use strict";
var KEY="cdshelves.v1", OLD="cdlog.v1";
var S={shelves:[],cds:[]};            // state
var ui={open:null,q:"",sheet:null};   // open = id of cd being edited
var app=document.getElementById("app");

/* ---------- storage ---------- */
function load(){
  try{var d=JSON.parse(localStorage.getItem(KEY)||"null"); if(d&&d.shelves){S=d;return}}catch(e){}
  // migrate earlier flat list if present
  try{
    var old=JSON.parse(localStorage.getItem(OLD)||"[]");
    if(old.length){var sh={id:uid(),name:"Unsorted"};S.shelves=[sh];
      S.cds=old.map(function(o){return{id:o.id||uid(),shelf:sh.id,artist:o.artist||"",title:o.title||"",year:o.year||"",notes:o.notes||""}});save()}
  }catch(e){}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Couldn't save — storage is full or blocked")}}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function cmp(a,b){return String(a||"").toLowerCase().localeCompare(String(b||"").toLowerCase(),undefined,{numeric:true})}
function shelfById(id){return S.shelves.find(function(s){return s.id===id})}
function cdsOn(id){return S.cds.filter(function(c){return c.shelf===id})}
function hue(str){var h=0;for(var i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))>>>0;return h%360}
function route(){var h=location.hash.slice(1);return h&&shelfById(h)?h:null}
function go(id){ui.open=null;ui.q="";location.hash=id||"";if(!id)render()}
var toastT;function toast(t){var e=document.createElement("div");e.className="toast";e.textContent=t;document.body.appendChild(e);clearTimeout(toastT);setTimeout(function(){e.remove()},2200)}

/* ---------- views ---------- */
function spines(list){
  var n=Math.min(list.length,22);
  var out="";
  for(var i=0;i<n;i++){var c=list[i],hh=hue(c.artist+c.title),ht=26+((hh*7+i*13)%28);
    out+='<i style="height:'+ht+'px;background:hsl('+hh+' 45% '+(42+(i%3)*6)+'%)"></i>'}
  return '<div class="spines">'+out+'</div>';
}

function home(){
  var q=ui.q.trim().toLowerCase(), h="";
  h+='<div class="bar"><h1>CD Shelves<span class="sub">'+S.cds.length+' CD'+(S.cds.length===1?"":"s")+' on '+S.shelves.length+(S.shelves.length===1?' shelf':' shelves')+'</span></h1>'
   +'<button class="icon" data-a="menu" aria-label="Backup and import">⋯</button></div>';
  if(S.cds.length) h+='<input class="search" id="q" type="search" placeholder="Search all CDs…" value="'+esc(ui.q)+'">';
  if(q){
    var hits=S.cds.filter(function(c){return (c.artist+" "+c.title+" "+c.notes+" "+c.year).toLowerCase().indexOf(q)>-1}).sort(function(a,b){return cmp(a.artist,b.artist)||cmp(a.title,b.title)});
    if(!hits.length) h+='<div class="empty"><b>🔍</b>No matches</div>';
    hits.forEach(function(c){var s=shelfById(c.shelf);
      h+='<div class="cd"><button data-a="gotoCd" data-id="'+c.shelf+'"><div class="a">'+esc(c.artist)+'</div><div class="t">'+esc(c.title)+'</div><div class="meta">on '+esc(s?s.name:"?")+'</div></button></div>'});
    return h;
  }
  h+='<div class="shelves">';
  S.shelves.forEach(function(s){var l=cdsOn(s.id);
    h+='<button class="shelf" data-a="open" data-id="'+s.id+'"><div class="nm">'+esc(s.name)+'</div><div class="ct">'+l.length+' CD'+(l.length===1?"":"s")+'</div>'+spines(l)+'</button>'});
  h+='<button class="newshelf" data-a="newShelf"><span><b>+</b>New shelf</span></button></div>';
  if(!S.shelves.length) h+='<div class="empty"><b>📀</b>Start by making your first shelf,<br>like “Shelf 1” or “Rock”.</div>';
  return h;
}

function shelfView(id){
  var s=shelfById(id), list=cdsOn(id).sort(function(a,b){return cmp(a.artist,b.artist)||cmp(a.title,b.title)});
  var h='<div class="bar"><button class="icon" data-a="back" aria-label="Back">←</button>'
   +'<h1>'+esc(s.name)+'<span class="sub">'+list.length+' CD'+(list.length===1?"":"s")+'</span></h1>'
   +'<button class="icon" data-a="shelfMenu" aria-label="Shelf options">⋯</button></div>';
  h+='<form class="quick" id="add" autocomplete="off"><input class="field" id="fa" placeholder="Artist" value="'+esc(ui.lastArtist||"")+'" enterkeyhint="next">'
   +'<div class="row"><input class="field" id="ft" placeholder="Album title" enterkeyhint="done"><button class="btn" type="submit">Add</button></div></form>';
  if(!list.length) h+='<div class="empty"><b>🎶</b>This shelf is empty.<br>Add your first CD above.</div>';
  var last="";
  list.forEach(function(c){
    var L=(c.artist.trim()[0]||"#").toUpperCase(); if(!/[A-Z]/.test(L))L="#";
    if(L!==last){h+='<div class="letter">'+L+'</div>';last=L}
    var open=ui.open===c.id;
    h+='<div class="cd"><button data-a="toggle" data-id="'+c.id+'"><div class="a">'+esc(c.artist)+'</div><div class="t">'+esc(c.title)+'</div>'
      +((c.year||c.notes)?'<div class="meta">'+esc([c.year,c.notes].filter(Boolean).join(" · "))+'</div>':'')+'</button>';
    if(open){
      h+='<div class="edit" data-cd="'+c.id+'">'
       +'<label>Artist<input class="field" data-f="artist" value="'+esc(c.artist)+'"></label>'
       +'<label>Album<input class="field" data-f="title" value="'+esc(c.title)+'"></label>'
       +'<div class="row"><label style="flex:1">Year<input class="field" data-f="year" inputmode="numeric" maxlength="4" value="'+esc(c.year)+'"></label>'
       +'<label style="flex:2">Notes<input class="field" data-f="notes" value="'+esc(c.notes)+'"></label></div>'
       +'<label>Shelf<select class="field" data-f="shelf">'+S.shelves.map(function(x){return '<option value="'+x.id+'"'+(x.id===c.shelf?" selected":"")+'>'+esc(x.name)+'</option>'}).join("")+'</select></label>'
       +'<div class="row"><button class="btn bad" data-a="delCd" data-id="'+c.id+'">Delete</button><button class="btn" data-a="toggle" data-id="'+c.id+'" style="flex:1">Done</button></div></div>';
    }
    h+='</div>';
  });
  return h;
}

function render(){
  var id=route();
  app.innerHTML=id?shelfView(id):home();
  if(!id&&ui.q){var q=document.getElementById("q");if(q){q.focus();q.setSelectionRange(q.value.length,q.value.length)}}
}

/* ---------- sheets ---------- */
function sheet(html){closeSheet();var d=document.createElement("div");d.className="scrim";d.id="scrim";d.innerHTML='<div class="sheet">'+html+'</div>';
  d.addEventListener("click",function(e){if(e.target===d)closeSheet()});document.body.appendChild(d);var f=d.querySelector("input");if(f)f.focus();return d}
function closeSheet(){var d=document.getElementById("scrim");if(d)d.remove()}

function askName(title,val,okLabel,cb){
  var d=sheet('<h2>'+title+'</h2><form id="nf"><input class="field" id="nm" value="'+esc(val||"")+'" placeholder="e.g. Shelf 1, Rock, Box on desk" maxlength="40"></form>'
    +'<div class="row"><button class="btn alt" id="x">Cancel</button><button class="btn" id="ok">'+okLabel+'</button></div>');
  function done(){var v=d.querySelector("#nm").value.trim();if(!v)return;closeSheet();cb(v)}
  d.querySelector("#x").onclick=closeSheet;d.querySelector("#ok").onclick=done;d.querySelector("#nf").onsubmit=function(e){e.preventDefault();done()};
  var i=d.querySelector("#nm");i.select();
}
function confirmSheet(title,msg,okLabel,cb){
  var d=sheet('<h2>'+title+'</h2><p>'+msg+'</p><div class="row"><button class="btn alt" id="x">Cancel</button><button class="btn bad" id="ok" style="background:var(--danger);color:#fff;border:0">'+okLabel+'</button></div>');
  d.querySelector("#x").onclick=closeSheet;d.querySelector("#ok").onclick=function(){closeSheet();cb()};
}

/* ---------- backup / import ---------- */
function toCSV(){
  var q=function(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var rows=["shelf,artist,title,year,notes"];
  S.shelves.forEach(function(s){cdsOn(s.id).forEach(function(c){rows.push([s.name,c.artist,c.title,c.year,c.notes].map(q).join(","))})});
  return rows.join("\n");
}
function parseCSV(t){var rows=[],r=[],c="",inq=false;
  for(var i=0;i<t.length;i++){var ch=t[i];
    if(inq){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else inq=false}else c+=ch}
    else if(ch==='"')inq=true;else if(ch===","||ch==="\t"){r.push(c);c=""}
    else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;r.push(c);c="";if(r.some(function(x){return x.trim()}))rows.push(r);r=[]}
    else c+=ch}
  r.push(c);if(r.some(function(x){return x.trim()}))rows.push(r);return rows}
function importCSV(t){
  var rows=parseCSV(t);if(rows.length&&/^shelf$/i.test(rows[0][0].trim()))rows.shift();
  var n=0;rows.forEach(function(r){var sn=(r[0]||"").trim()||"Unsorted",a=(r[1]||"").trim(),ti=(r[2]||"").trim();if(!a&&!ti)return;
    var s=S.shelves.find(function(x){return x.name.toLowerCase()===sn.toLowerCase()});if(!s){s={id:uid(),name:sn};S.shelves.push(s)}
    S.cds.push({id:uid(),shelf:s.id,artist:a,title:ti,year:(r[3]||"").trim(),notes:(r[4]||"").trim()});n++});
  save();render();return n}
function download(){
  var u=URL.createObjectURL(new Blob([toCSV()],{type:"text/csv"})),a=document.createElement("a");
  a.href=u;a.download="cd-shelves.csv";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1500)}

function mainMenu(){
  var d=sheet('<h2>Backup &amp; import</h2><p>Your CDs live on this device only. Download a backup now and then.</p><div class="menu">'
    +'<button class="item" id="dl">⬇︎ Download backup (CSV)</button><button class="item" id="cp">⧉ Copy as CSV</button>'
    +'<button class="item" id="im">⬆︎ Import from CSV file</button><button class="item" id="pa">✎ Import pasted rows</button></div>'
    +'<p>CSV columns: shelf, artist, title, year, notes.</p><input type="file" id="file" accept=".csv,text/csv,text/plain" hidden>');
  d.querySelector("#dl").onclick=function(){download();closeSheet();toast("Backup downloaded")};
  d.querySelector("#cp").onclick=function(){try{navigator.clipboard.writeText(toCSV()).then(function(){closeSheet();toast("Copied")},function(){toast("Copy blocked")})}catch(e){toast("Copy blocked")}};
  d.querySelector("#im").onclick=function(){d.querySelector("#file").click()};
  d.querySelector("#file").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var n=importCSV(String(r.result));closeSheet();toast("Imported "+n+" CD"+(n===1?"":"s"))};r.readAsText(f)};
  d.querySelector("#pa").onclick=function(){
    var d2=sheet('<h2>Paste CSV rows</h2><textarea class="field" id="ta" placeholder="Shelf 1,Pink Floyd,The Wall,1979,"></textarea><div class="row"><button class="btn alt" id="x">Cancel</button><button class="btn" id="ok">Import</button></div>');
    d2.querySelector("#x").onclick=closeSheet;d2.querySelector("#ok").onclick=function(){var n=importCSV(d2.querySelector("#ta").value);closeSheet();toast("Imported "+n+" CD"+(n===1?"":"s"))}};
}
function shelfMenu(id){
  var s=shelfById(id);
  var d=sheet('<h2>'+esc(s.name)+'</h2><div class="menu"><button class="item" id="rn">✎ Rename shelf</button><button class="item" id="dl" style="color:var(--danger)">🗑 Delete shelf</button></div>');
  d.querySelector("#rn").onclick=function(){askName("Rename shelf",s.name,"Save",function(v){s.name=v;save();render()})};
  d.querySelector("#dl").onclick=function(){
    var n=cdsOn(id).length, others=S.shelves.filter(function(x){return x.id!==id});
    if(!n){confirmSheet("Delete this shelf?","It's empty, so nothing else is affected.","Delete",function(){S.shelves=others;save();go(null)});return}
    var d2=sheet('<h2>Delete “'+esc(s.name)+'”?</h2><p>It has '+n+' CD'+(n===1?"":"s")+'. Move them to another shelf first, or delete them with the shelf.</p>'
      +(others.length?'<select class="field" id="mv">'+others.map(function(x){return '<option value="'+x.id+'">Move to '+esc(x.name)+'</option>'}).join("")+'</select><button class="btn" id="moveDel">Move CDs, then delete shelf</button>':'')
      +'<button class="btn bad" id="allDel">Delete shelf and its '+n+' CD'+(n===1?"":"s")+'</button><button class="btn alt" id="x">Cancel</button>');
    d2.querySelector("#x").onclick=closeSheet;
    var mv=d2.querySelector("#moveDel");if(mv)mv.onclick=function(){var to=d2.querySelector("#mv").value;S.cds.forEach(function(c){if(c.shelf===id)c.shelf=to});S.shelves=others;save();closeSheet();go(null);toast("Moved "+n+" CD"+(n===1?"":"s"))};
    d2.querySelector("#allDel").onclick=function(){S.cds=S.cds.filter(function(c){return c.shelf!==id});S.shelves=others;save();closeSheet();go(null)};
  };
}

/* ---------- events ---------- */
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;var a=b.dataset.a,id=b.dataset.id;
  if(a==="open"||a==="gotoCd")go(id);
  else if(a==="back")go(null);
  else if(a==="newShelf")askName("New shelf","","Create",function(v){var s={id:uid(),name:v};S.shelves.push(s);save();go(s.id)});
  else if(a==="menu")mainMenu();
  else if(a==="shelfMenu")shelfMenu(route());
  else if(a==="toggle"){ui.open=ui.open===id?null:id;render();if(ui.open){var el=app.querySelector('[data-cd="'+id+'"]');if(el)el.scrollIntoView({block:"nearest",behavior:"smooth"})}}
  else if(a==="delCd")confirmSheet("Delete this CD?","This can't be undone.","Delete",function(){S.cds=S.cds.filter(function(c){return c.id!==id});ui.open=null;save();render()});
});
app.addEventListener("submit",function(e){
  if(e.target.id!=="add")return;e.preventDefault();
  var sid=route(),a=document.getElementById("fa").value.trim(),t=document.getElementById("ft").value.trim();
  if(!a){document.getElementById("fa").focus();return}
  if(!t){document.getElementById("ft").focus();return}
  S.cds.push({id:uid(),shelf:sid,artist:a,title:t,year:"",notes:""});save();ui.lastArtist=a;render();
  document.getElementById("ft").focus();
});
app.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="q"){ui.q=t.value;render();return}
  if(t.dataset&&t.dataset.f){var box=t.closest("[data-cd]"),c=S.cds.find(function(x){return x.id===box.dataset.cd});if(!c)return;
    c[t.dataset.f]=t.value;save();
    if(t.dataset.f==="shelf"){ui.open=null;render();toast("Moved to "+shelfById(t.value).name)}}
});
window.addEventListener("hashchange",function(){ui.open=null;render()});

load();render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(function(){});
})();
</script>
</body>
</html>
